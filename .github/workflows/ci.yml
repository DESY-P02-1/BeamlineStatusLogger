name: Run Python tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Build and start docker container
        run: |
          docker compose build
          docker compose up -d
          sleep 3

      - name: Run tests
        run: |
          docker compose exec -T python-test python3 -m pip install -r dev-requirements.txt
          docker compose exec -T python-test python3 -m pip install .
          docker compose exec -T python-test python3 -m pytest --cov=BeamlineStatusLogger --cov-report xml:coverage.xml
